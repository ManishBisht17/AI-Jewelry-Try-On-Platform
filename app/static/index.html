<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JewelryTryOn</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto max-w-6xl px-6 py-10">
      <header class="mb-10">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-300">JewelryTryOn</p>
        <h1 class="mt-3 text-4xl font-semibold tracking-tight">See your design worn naturally.</h1>
        <p class="mt-3 max-w-2xl text-stone-400">
          Upload a jewelry photo, choose a model, and generate a realistic try-on preview.
        </p>
      </header>

      <section class="grid gap-8 lg:grid-cols-[0.85fr_1.15fr]">
        <form id="try-on-form" class="rounded-2xl border border-stone-800 bg-stone-900 p-6 shadow-2xl">
          <div class="space-y-6">
            <label class="block">
              <span class="text-sm font-medium text-stone-300">Jewelry photo</span>
              <input
                id="jewelry-file"
                name="file"
                type="file"
                accept="image/jpeg,image/png"
                required
                class="mt-2 block w-full rounded-lg border border-dashed border-stone-700 bg-stone-950 p-4 text-sm text-stone-400 file:mr-4 file:rounded-md file:border-0 file:bg-amber-300 file:px-3 file:py-2 file:font-semibold file:text-stone-950"
              />
              <span class="mt-2 block text-xs text-stone-500">JPG or PNG, maximum 10 MB.</span>
            </label>

            <label class="block">
              <span class="text-sm font-medium text-stone-300">Jewelry type</span>
              <select id="jewelry-type" class="mt-2 w-full rounded-lg border border-stone-700 bg-stone-950 px-3 py-3 text-sm">
                <option value="earrings">Earrings</option>
                <option value="necklace">Necklace</option>
                <option value="ring">Ring</option>
                <option value="bracelet">Bracelet</option>
              </select>
            </label>

            <div>
              <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-stone-300">Choose a model</span>
                <span id="model-status" class="text-xs text-stone-500"></span>
              </div>
              <div id="model-list" class="mt-3 grid grid-cols-2 gap-3"></div>
            </div>

            <label class="block">
              <span class="text-sm font-medium text-stone-300">Preview quality</span>
              <select id="quality" class="mt-2 w-full rounded-lg border border-stone-700 bg-stone-950 px-3 py-3 text-sm">
                <option value="low" selected>Low (recommended)</option>
                <option value="medium">Medium</option>
                <option value="high">High (final download)</option>
              </select>
            </label>

            <button id="generate-button" type="submit" class="w-full rounded-lg bg-amber-300 px-4 py-3 font-semibold text-stone-950 transition hover:bg-amber-200 disabled:cursor-not-allowed disabled:opacity-50">
              Generate try-on
            </button>
            <p id="error-message" class="hidden rounded-lg border border-red-900 bg-red-950/40 p-3 text-sm text-red-300"></p>
          </div>
        </form>

        <section class="rounded-2xl border border-stone-800 bg-stone-900 p-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-semibold">Your result</h2>
            <span id="job-status" class="rounded-full bg-stone-800 px-3 py-1 text-xs text-stone-400">Waiting</span>
          </div>
          <div id="empty-state" class="flex min-h-[26rem] items-center justify-center text-center text-stone-500">
            Upload a jewelry photo and generate a preview to see the result here.
          </div>
          <div id="result-view" class="hidden">
            <div class="mt-6 grid gap-4 sm:grid-cols-2">
              <figure>
                <figcaption class="mb-2 text-sm text-stone-400">Original jewelry</figcaption>
                <img id="original-preview" class="aspect-square w-full rounded-xl bg-stone-950 object-contain" alt="Original jewelry" />
              </figure>
              <figure>
                <figcaption class="mb-2 text-sm text-stone-400">AI try-on</figcaption>
                <img id="result-preview" class="aspect-square w-full rounded-xl bg-stone-950 object-contain" alt="Generated try-on result" />
              </figure>
            </div>
            <div class="mt-5 flex flex-wrap gap-3">
              <a id="download-button" download="jewelrytryon-result.png" class="rounded-lg bg-amber-300 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-amber-200">Download</a>
              <button id="regenerate-button" type="button" class="rounded-lg border border-stone-700 px-4 py-2 text-sm font-semibold hover:border-stone-500">Regenerate</button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script>
      const form = document.querySelector("#try-on-form");
      const fileInput = document.querySelector("#jewelry-file");
      const typeInput = document.querySelector("#jewelry-type");
      const qualityInput = document.querySelector("#quality");
      const modelList = document.querySelector("#model-list");
      const modelStatus = document.querySelector("#model-status");
      const statusBadge = document.querySelector("#job-status");
      const errorMessage = document.querySelector("#error-message");
      const generateButton = document.querySelector("#generate-button");
      const resultView = document.querySelector("#result-view");
      const emptyState = document.querySelector("#empty-state");
      const originalPreview = document.querySelector("#original-preview");
      const resultPreview = document.querySelector("#result-preview");
      const downloadButton = document.querySelector("#download-button");
      const regenerateButton = document.querySelector("#regenerate-button");
      let selectedModelId = null;
      let lastJob = null;

      const bodyPartForType = {
        earrings: "ear",
        necklace: "neck",
        ring: "hand",
        bracelet: "wrist",
      };

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.remove("hidden");
      }

      function clearError() {
        errorMessage.classList.add("hidden");
        errorMessage.textContent = "";
      }

      function setStatus(message) {
        statusBadge.textContent = message;
        statusBadge.className = "rounded-full bg-stone-800 px-3 py-1 text-xs text-stone-300";
      }

      async function responseError(response, fallback) {
        const body = await response.text();
        if (!body) return fallback;
        try {
          const parsed = JSON.parse(body);
          return parsed.detail || parsed.error || fallback;
        } catch {
          return body.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim() || fallback;
        }
      }

      async function loadModels() {
        modelStatus.textContent = "Loading...";
        modelList.replaceChildren();
        const response = await fetch(`/api/models?body_part=${bodyPartForType[typeInput.value]}`);
        if (!response.ok) throw new Error("Could not load model photos.");
        const { models } = await response.json();
        selectedModelId = models[0]?.id ?? null;
        modelStatus.textContent = `${models.length} available`;
        models.forEach((model, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.modelId = model.id;
          button.className = `rounded-xl border p-2 text-left ${index === 0 ? "border-amber-300" : "border-stone-700"}`;
          button.innerHTML = `<div class="flex aspect-square items-center justify-center overflow-hidden rounded-lg bg-stone-950"><img src="/${model.image}" alt="${model.name}" class="h-full w-full object-cover" /></div><span class="mt-2 block truncate text-xs">${model.name}</span>`;
          button.addEventListener("click", () => {
            selectedModelId = model.id;
            modelList.querySelectorAll("button").forEach((item) => item.classList.replace("border-amber-300", "border-stone-700"));
            button.classList.replace("border-stone-700", "border-amber-300");
          });
          modelList.append(button);
        });
      }

      async function createJob() {
        clearError();
        const file = fileInput.files[0];
        if (!file || !selectedModelId) {
          showError("Choose a jewelry image and a model first.");
          return;
        }
        generateButton.disabled = true;
        setStatus("Uploading");
        originalPreview.src = URL.createObjectURL(file);
        emptyState.classList.add("hidden");
        resultView.classList.remove("hidden");
        const formData = new FormData();
        formData.append("file", file);
        formData.append("jewelry_type", typeInput.value);
        const uploadResponse = await fetch("/api/upload", { method: "POST", body: formData });
        if (!uploadResponse.ok) throw new Error(await responseError(uploadResponse, "Upload failed."));
        const { upload_id } = await uploadResponse.json();
        const jobResponse = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ upload_id, model_id: selectedModelId, quality: qualityInput.value }),
        });
        if (!jobResponse.ok) throw new Error(await responseError(jobResponse, "Could not start generation."));
        lastJob = { upload_id, model_id: selectedModelId };
        const { job_id } = await jobResponse.json();
        setStatus("Queued");
        await pollJob(job_id);
      }

      async function pollJob(jobId) {
        const response = await fetch(`/api/jobs/${jobId}`);
        if (!response.ok) throw new Error(await responseError(response, "Could not read generation status."));
        const job = await response.json();
        setStatus(job.status);
        if (job.status === "done") {
          resultPreview.src = `${job.result_url}?t=${Date.now()}`;
          downloadButton.href = job.result_url;
          generateButton.disabled = false;
          return;
        }
        if (job.status === "failed") throw new Error(job.error || "Generation failed.");
        window.setTimeout(() => pollJob(jobId).catch((error) => {
          generateButton.disabled = false;
          showError(error.message);
          setStatus("Failed");
        }), 3000);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        createJob().catch((error) => {
          generateButton.disabled = false;
          showError(error.message);
          setStatus("Failed");
        });
      });

      regenerateButton.addEventListener("click", () => {
        if (lastJob) createJob().catch((error) => showError(error.message));
      });

      typeInput.addEventListener("change", () => {
        loadModels().catch((error) => showError(error.message));
      });

      loadModels().catch((error) => showError(error.message));
    </script>
  </body>
</html>
